; GARBALIA POS - safe shared-hosting performance defaults
; OPcache must be enabled by the host at PHP startup. Enabling it here
; when the host has disabled it emits a warning on every request.
; Cache capacity is controlled by the host's system-level configuration.

opcache.validate_timestamps=1
opcache.revalidate_freq=2

realpath_cache_size=4096K
realpath_cache_ttl=600

session.use_strict_mode=1
session.gc_probability=1
session.gc_divisor=1000
session.gc_maxlifetime=28800

max_execution_time=30

; Keep database details in the server log, never in HTML or JSON.
display_errors=0
log_errors=1
